<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hifdh — Memorisation Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4efe4;
  --bg2:#efe8d8;
  --ink:#2a2218;
  --ink-soft:#6b5d45;
  --line:#d8cdb3;
  --paper:#fbf7ed;
  --gold:#a07d28;
  --gold-soft:#c9a94e;
  --green:#3f6f4f;
  --teal:#2f6f6a;
  --none:#e4dcc7;
  --weak:#c98a4b;
  --mid:#cdb24a;
  --strong:#4f8a5b;
  --shadow:0 1px 2px rgba(60,45,20,.06),0 8px 30px rgba(60,45,20,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Outfit',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background-image:radial-gradient(ellipse at 20% 0%,rgba(200,170,90,.10),transparent 55%),radial-gradient(ellipse at 90% 100%,rgba(60,110,90,.07),transparent 50%);min-height:100vh;padding-bottom:64px}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:600;letter-spacing:.2px}
.app-head{padding:34px 0 18px;text-align:center;position:relative}
.app-head .bism{font-family:'Amiri',serif;font-size:26px;color:var(--gold);margin-bottom:10px;opacity:.85}
.app-head h1{font-size:40px;font-weight:700;line-height:1}
.app-head .sub{color:var(--ink-soft);font-size:14px;margin-top:8px;letter-spacing:.4px}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:6px 0 0}

.tabs{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin:22px 0 26px}
.tab{font-family:'Outfit';font-size:14px;font-weight:500;color:var(--ink-soft);background:transparent;border:1px solid transparent;padding:9px 18px;border-radius:999px;cursor:pointer;transition:.18s}
.tab:hover{color:var(--ink);background:rgba(160,125,40,.07)}
.tab.active{color:var(--paper);background:var(--ink);box-shadow:var(--shadow)}

.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.section{display:none;animation:fade .35s ease}
.section.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* OVERVIEW */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
.stat{padding:20px 22px}
.stat .lbl{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:var(--ink-soft)}
.stat .big{font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:700;line-height:1.05;margin-top:6px}
.stat .big small{font-size:17px;color:var(--ink-soft);font-weight:500}
.stat .meta{font-size:12.5px;color:var(--ink-soft);margin-top:4px}
.bar{height:7px;background:var(--none);border-radius:99px;overflow:hidden;margin-top:14px;display:flex}
.bar i{height:100%;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);margin-top:14px;align-items:center}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block}
.ov-title{font-size:23px;margin:30px 0 4px}
.ov-note{color:var(--ink-soft);font-size:13px;margin-bottom:16px}

.juz-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.jz{padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);cursor:pointer;transition:.16s}
.jz:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.jz .n{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600}
.jz .pct{font-size:12px;color:var(--ink-soft);margin-top:2px}
.jz .mini{height:5px;border-radius:99px;background:var(--none);overflow:hidden;margin-top:9px;display:flex}
.jz .mini i{height:100%}

/* TRACKER */
.tracker-top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.jselect{display:flex;gap:5px;flex-wrap:wrap}
.jbtn{font-family:'Outfit';font-size:13px;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);cursor:pointer;transition:.14s;font-weight:500}
.jbtn:hover{border-color:var(--gold-soft);color:var(--ink)}
.jbtn.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.jbtn .d{font-size:8px;display:block;line-height:1;margin-top:2px}
.surah-nav{display:flex;align-items:stretch;gap:8px}
.surah-select{flex:1;min-width:0;font-family:'Outfit';font-size:14.5px;font-weight:500;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:12px 14px;cursor:pointer;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2712%27%20height%3D%2712%27%3E%3Cpath%20d%3D%27M2%204l4%204%204-4%27%20stroke%3D%27%236b5d45%27%20stroke-width%3D%271.6%27%20fill%3D%27none%27%20stroke-linecap%3D%27round%27%2F%3E%3C%2Fsvg%3E");background-repeat:no-repeat;background-position:right 16px center;padding-right:38px;transition:.14s}
.surah-select:hover{border-color:var(--gold-soft)}
.surah-select:focus{outline:none;border-color:var(--gold)}
.navbtn{font-family:'Cormorant Garamond',serif;font-size:24px;line-height:1;width:48px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:11px;cursor:pointer;transition:.14s;flex-shrink:0}
.navbtn:hover:not(:disabled){background:var(--ink);color:var(--paper);border-color:var(--ink)}
.navbtn:disabled{opacity:.32;cursor:not-allowed}

.help{font-size:12.5px;color:var(--ink-soft);background:rgba(160,125,40,.07);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:16px;line-height:1.55}
.help b{color:var(--ink)}

.surah-blk{margin-bottom:20px}
.surah-h{display:flex;align-items:baseline;gap:10px;padding:6px 2px 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.surah-h .sn{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:600}
.surah-h .sm{font-size:12.5px;color:var(--ink-soft)}
.surah-h .sx{font-size:12px;color:var(--ink-soft);margin-left:auto}

.ruku-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-radius:10px;transition:.14s}
.ruku-row:hover{background:rgba(160,125,40,.05)}
.ruku-row .rk{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:600;min-width:74px}
.ruku-row .rk small{display:block;font-family:'Outfit';font-size:10.5px;color:var(--ink-soft);font-weight:400;letter-spacing:.3px}
.scales{display:flex;gap:22px;flex-wrap:wrap;margin-left:auto}
.scale{display:flex;flex-direction:column;gap:5px}
.scale .cap{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft)}
.pips{display:flex;gap:4px}
.pip{width:28px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:11.5px;color:var(--ink-soft);transition:.13s;display:flex;align-items:center;justify-content:center;font-weight:600;padding:0}
.pip:hover{border-color:var(--gold-soft)}
.pip.on{color:#fff;border-color:transparent;font-weight:600}
.pip.a-1.on{background:#d99a6c}.pip.a-2.on{background:#d9b35a}.pip.a-3.on{background:#cdb24a}.pip.a-4.on{background:#7aa564}.pip.a-5.on{background:#4f8a5b}
.pip.e-1.on{background:#9bb0c4}.pip.e-2.on{background:#7a9bb5}.pip.e-3.on{background:#5b8aa0}.pip.e-4.on{background:#3f7d78}.pip.e-5.on{background:#2f6f4f}

/* PLANNER — CALENDAR */
.cal-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.cal-title{display:flex;align-items:center;gap:14px}
.cal-title h2{font-size:25px}
.todaybtn{font-family:'Outfit';font-size:12px;font-weight:600;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 13px;cursor:pointer;transition:.14s}
.todaybtn:hover{border-color:var(--gold-soft);color:var(--ink)}
.cal-ctrl{display:flex;align-items:center;gap:8px}
.viewtog{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:3px}
.vt{font-family:'Outfit';font-size:12.5px;font-weight:500;color:var(--ink-soft);background:none;border:none;padding:7px 15px;border-radius:7px;cursor:pointer;transition:.14s}
.vt.on{background:var(--ink);color:var(--paper)}
.navb{font-family:'Cormorant Garamond',serif;font-size:21px;line-height:1;width:40px;height:38px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:9px;cursor:pointer;transition:.14s}
.navb:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cal-legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);margin-bottom:14px}
.cal-legend span{display:flex;align-items:center;gap:6px}
.cdot{width:9px;height:9px;border-radius:3px;display:inline-block;flex-shrink:0}
.qtag{width:9px;height:9px;border-radius:3px;display:inline-block;flex-shrink:0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.cal-dow{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-soft);text-align:center;padding:2px 0 4px;font-weight:500}
.cell{border:1px solid var(--line);border-radius:11px;background:var(--paper);padding:9px 9px 8px;cursor:pointer;transition:.13s;min-height:64px;display:flex;flex-direction:column;gap:6px}
.cal-grid.week .cell{min-height:150px}
.cell:hover{border-color:var(--gold-soft);transform:translateY(-1px);box-shadow:var(--shadow)}
.cell.dim{opacity:.42}
.cell.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.cell.sel{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink) inset}
.cnum{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:600;display:flex;align-items:baseline;gap:6px}
.cnum em{font-family:'Outfit';font-style:normal;font-size:9px;text-transform:uppercase;letter-spacing:.7px;color:var(--gold);font-weight:600}
.cdots{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:auto}
.cmore{font-size:9.5px;color:var(--ink-soft);font-style:normal}
.clines{display:flex;flex-direction:column;gap:4px}
.cline{display:flex;align-items:center;gap:6px;font-size:11.5px;background:var(--bg2);border-radius:6px;padding:4px 7px;line-height:1.25}
.cline span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cline.cdone{opacity:.45;text-decoration:line-through}
.cnone{font-size:11px;color:var(--ink-soft);opacity:.5}
.day-panel{margin-top:18px;padding:20px 22px;animation:fade .3s}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.ph h3{font-size:21px}
.pclose{border:none;background:none;font-size:15px;color:var(--ink-soft);cursor:pointer;padding:5px 8px;border-radius:7px;transition:.13s}
.pclose:hover{background:rgba(160,40,40,.1);color:#a33}
.plist{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.pentry{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-size:13.5px;animation:fade .22s}
.pentry.pdone{opacity:.55}
.pentry.pdone .pt b{text-decoration:line-through}
.pt{flex:1;line-height:1.35}
.pt span{color:var(--ink-soft);font-size:12.5px}
.pdoneb,.pdel{border:none;background:transparent;cursor:pointer;font-size:14px;color:var(--ink-soft);padding:4px 7px;border-radius:6px;transition:.13s;line-height:1}
.pdoneb{color:var(--green)}.pdoneb:hover{background:rgba(60,110,80,.14)}
.pdel:hover{background:rgba(160,40,40,.1);color:#a33}
.pempty{font-size:13px;color:var(--ink-soft);font-style:italic;padding:10px 2px;text-align:center}
.padd{border-top:1px solid var(--line);padding-top:16px}
.pact{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px}
.actbtn{font-family:'Outfit';font-size:12.5px;font-weight:500;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:9px 13px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.13s}
.actbtn:hover{border-color:var(--gold-soft)}
.actbtn.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.actbtn.sel .qtag{box-shadow:0 0 0 2px rgba(255,255,255,.4)}
.pnoterow{display:flex;gap:8px}
.pnoterow input{flex:1;min-width:0;font-family:'Outfit';font-size:13.5px;padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink)}
.pnoterow input:focus{outline:none;border-color:var(--gold)}
.pnoterow button{font-family:'Outfit';font-size:13px;font-weight:600;padding:11px 20px;border:none;border-radius:9px;background:var(--ink);color:var(--paper);cursor:pointer;transition:.15s}
.pnoterow button:hover:not(:disabled){background:var(--gold)}
.pnoterow button:disabled{opacity:.4;cursor:not-allowed}
.phint{font-size:11.5px;color:var(--ink-soft);margin-top:9px}
@media(max-width:680px){.cal-grid.month{gap:4px}.cal-grid.month .cell{min-height:52px;padding:6px 5px}.cnum{font-size:13px}.cal-grid.week{grid-template-columns:1fr;gap:7px}.cal-grid.week .cal-dow{display:none}.cal-grid.week .cell{min-height:auto;flex-direction:row;flex-wrap:wrap;align-items:flex-start}.cal-grid.week .cnum{min-width:60px}.cal-grid.week .clines{flex:1}}

.foot{text-align:center;font-size:12px;color:var(--ink-soft);padding:34px 0 8px;line-height:1.7}
.foot .tools{display:flex;gap:14px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.foot button{font-family:'Outfit';font-size:12.5px;color:var(--ink-soft);background:none;border:1px solid var(--line);border-radius:8px;padding:8px 18px;cursor:pointer;transition:.14s}
.foot button:hover{border-color:var(--gold-soft);color:var(--ink)}
.foot button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
.foot button.primary:hover{background:var(--gold);border-color:var(--gold);color:#fff}
.save-banner{border-radius:12px;padding:13px 18px;margin-bottom:20px;font-size:13.5px;line-height:1.6;animation:fade .3s}
.save-banner .sub{color:var(--ink-soft);font-size:12px}
.save-banner.info{background:rgba(160,125,40,.08);border:1px solid var(--line);color:var(--ink)}
.save-banner.warn{background:#fcefe6;border:1px solid #e3b89a;color:#7a3d1c}
.save-banner.ok{background:rgba(79,138,91,.10);border:1px solid #a9c9b0;color:#36603f;font-size:12.5px;padding:9px 16px;display:flex;align-items:center;gap:9px}
.save-banner .sdot{width:8px;height:8px;border-radius:50%;background:#4f8a5b;display:inline-block;flex-shrink:0}
.save-banner .rb{display:inline-block;margin-left:6px;font-family:'Outfit';font-size:12.5px;font-weight:700;color:#fff;background:#7a3d1c;border:1px solid #7a3d1c;border-radius:7px;padding:6px 16px;cursor:pointer;transition:.14s}
.save-banner .rb:hover{background:#5e2d12}
.save-banner .rb.alt{background:#fff;color:#7a3d1c;margin-left:8px}
.save-banner .rb.alt:hover{background:#f3e3d6}
.paste-ov{position:fixed;inset:0;background:rgba(42,34,24,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .2s}
.paste-box{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px rgba(40,30,15,.3);width:100%;max-width:560px;padding:22px 22px 18px}
.paste-box h3{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;margin-bottom:6px}
.paste-box p{font-size:13px;color:var(--ink-soft);line-height:1.55;margin-bottom:13px}
.paste-box textarea{width:100%;height:190px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.45;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg2);color:var(--ink);resize:vertical;-webkit-user-select:text;user-select:text}
.paste-box textarea:focus{outline:none;border-color:var(--gold)}
.paste-act{display:flex;gap:9px;margin-top:14px;justify-content:flex-end}
.paste-act .pgo{font-family:'Outfit';font-size:13px;font-weight:600;color:var(--paper);background:var(--ink);border:none;border-radius:9px;padding:10px 20px;cursor:pointer;transition:.14s}
.paste-act .pgo:hover{background:var(--gold)}
.paste-act .pcl{font-family:'Outfit';font-size:13px;color:var(--ink-soft);background:none;border:1px solid var(--line);border-radius:9px;padding:10px 18px;cursor:pointer;transition:.14s}
.paste-act .pcl:hover{border-color:var(--gold-soft);color:var(--ink)}
.save-pill{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--ink);color:var(--paper);font-size:12.5px;padding:9px 20px;border-radius:999px;box-shadow:var(--shadow);transition:.35s;letter-spacing:.3px;z-index:50;max-width:90vw;text-align:center}
.save-pill.show{transform:translateX(-50%) translateY(0)}
.loading{text-align:center;padding:80px 0;color:var(--ink-soft);font-family:'Cormorant Garamond',serif;font-size:20px}
</style>
</head>
<body>
<div class="wrap">
  <header class="app-head">
    <div class="bism">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
    <h1>Hifdh</h1>
    <div class="sub">RUKU&nbsp;·&nbsp;BY&nbsp;·&nbsp;RUKU&nbsp;&nbsp;—&nbsp;&nbsp;MEMORISATION&nbsp;&amp;&nbsp;UNDERSTANDING</div>
    <div class="divider"></div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-s="overview">Overview</button>
    <button class="tab" data-s="tracker">Ruku Tracker</button>
    <button class="tab" data-s="planner">Planner</button>
  </nav>

  <div class="save-banner" id="saveBanner" style="display:none"></div>

  <section id="overview" class="section active"><div class="loading">Loading your progress…</div></section>
  <section id="tracker" class="section"></section>
  <section id="planner" class="section"></section>

  <div class="foot">
    When hosted on the web, your progress saves <b>automatically</b> on this device.<br>
    <b>Save</b> / <b>Open</b> / <b>Copy backup</b> below are optional extras for keeping a safety copy.
    <div class="tools">
      <button id="exportBtn" class="primary">Save</button>
      <button id="importBtn">Open</button>
      <button id="copyBtn">Copy backup</button>
      <button id="pasteBtn">Paste backup</button>
      <input type="file" id="importFile" accept="application/json,.json" style="display:none">
    </div>
  </div>
</div>

<script>

/* ---------- STATE & PERSISTENCE (file-based) ---------- */
const KEY='hifdh_tracker_v1';
const MIRROR_KEY='hifdh_tracker_v1'; // used only if a session store happens to exist
let STATE={ratings:{},cal:{}};
let DIRTY=false;                 // unsaved changes since last successful save
let CHANGES=0;                   // count of edits since last save (for the indicator)
let FILE_HANDLE=null;            // FileSystemFileHandle if the browser supports it
let LAST_SAVED_AT=null;          // Date of last successful file save
const HAS_FS = (typeof window!=='undefined') && ('showSaveFilePicker' in window) && ('showOpenFilePicker' in window);

const A_LABELS=['Not memorised','Very weak','Weak','Middle','Strong','Very strong'];
const E_LABELS=['Not started','Very basic','Basic','Good','Strong','Can explain'];
const COL_A=['var(--none)','#d99a6c','#d9b35a','#cdb24a','#7aa564','#4f8a5b'];
const COL_E=['var(--none)','#9bb0c4','#7a9bb5','#5b8aa0','#3f7d78','#2f6f4f'];
const A_MAX=5, E_MAX=5;

function migrate(s){
  s.ratings=s.ratings||{};
  s.cal=s.cal||{};
  delete s.queues; delete s.week;
  if(s.scaleVersion!==2){
    const map={1:2,2:3,3:4};
    Object.keys(s.ratings).forEach(id=>{
      const x=s.ratings[id];
      if(x.a&&x.a<=3&&map[x.a])x.a=map[x.a];
      if(x.e&&x.e<=3&&map[x.e])x.e=map[x.e];
    });
    s.scaleVersion=2;
  }
  return s;
}

// Detect a working localStorage. On a real hosted site (GitHub Pages) this works
// and gives silent automatic saving. Inside a Claude artifact it does not — in
// which case we fall back to the file/copy methods so data is never lost.
let LS_OK=false;
(function(){
  try{
    const t='__hifdh_test__';
    window.localStorage.setItem(t,'1');
    window.localStorage.removeItem(t);
    LS_OK=true;
  }catch(e){ LS_OK=false; }
})();

// Load saved progress. Priority: localStorage (real site) -> artifact store (if any).
async function loadState(){
  // 1. localStorage — the primary store when hosted
  if(LS_OK){
    try{
      const raw=window.localStorage.getItem(KEY);
      if(raw){ STATE=migrate(JSON.parse(raw)); return; }
    }catch(e){ /* corrupt or blocked — fall through */ }
  }
  // 2. Opportunistic artifact/session store, if it happens to exist
  try{
    if(window.storage && typeof window.storage.get==='function'){
      const r=await window.storage.get(KEY);
      if(r&&r.value){ STATE=migrate(JSON.parse(r.value)); }
    }
  }catch(e){ /* expected when absent — ignore */ }
}

// Persist to localStorage automatically. Returns true if it actually saved.
function persistLocal(){
  if(!LS_OK) return false;
  try{
    window.localStorage.setItem(KEY,JSON.stringify(STATE));
    return true;
  }catch(e){ return false; }
}

// Opportunistic mirror to a session/artifact store if present — never relied upon.
async function mirrorSave(){
  try{
    if(window.storage && typeof window.storage.set==='function'){
      await window.storage.set(KEY,JSON.stringify(STATE));
    }
  }catch(e){ /* ignore */ }
}

function serialize(){ return JSON.stringify(STATE,null,2); }

function markChanged(){
  CHANGES++;
  const ok=persistLocal();      // automatic save on a hosted site
  mirrorSave();                 // harmless extra mirror if a store exists
  if(ok){
    // Saved silently and automatically — no manual action needed.
    DIRTY=false; LAST_SAVED_AT=new Date(); LAST_SAVED_WHERE='auto';
  }else{
    // No automatic store (e.g. running inside a Claude artifact) — mark dirty
    // so the manual Save / Copy backup prompts appear.
    DIRTY=true;
  }
  updateSaveUI();
}

// --- Capability detection ---
const CAN_SHARE_FILES = (typeof navigator!=='undefined') && !!navigator.canShare && (()=>{
  try{ return navigator.canShare({files:[new File(['x'],'x.json',{type:'application/json'})]}); }
  catch(e){ return false; }
})();

function markSaved(where){
  DIRTY=false; CHANGES=0; LAST_SAVED_AT=new Date(); LAST_SAVED_WHERE=where||'';
  persistLocal();
  updateSaveUI();
}

// Desktop Chrome/Edge: write straight back to a previously-picked file.
async function saveToHandle(){
  if(!FILE_HANDLE) return false;
  try{
    const w=await FILE_HANDLE.createWritable();
    await w.write(serialize());
    await w.close();
    markSaved('file'); showPill('Saved to your file');
    return true;
  }catch(e){ showPill('Save failed — try Save again'); return false; }
}

// Phone/tablet primary: open the OS share sheet with the data as a file,
// so it can be sent to iCloud Drive / Google Drive / Files / Notes.
async function shareSave(){
  const fname='hifdh-tracker.json';
  try{
    const file=new File([serialize()],fname,{type:'application/json'});
    if(CAN_SHARE_FILES){
      await navigator.share({files:[file],title:'Hifdh tracker backup'});
      markSaved('shared'); showPill('Saved — choose where to keep it');
      return true;
    }
  }catch(e){
    if(e && e.name==='AbortError'){ showPill('Save cancelled'); return false; }
    // fall through to download
  }
  return false;
}

function downloadBackup(){
  const blob=new Blob([serialize()],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='hifdh-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  markSaved('download'); showPill('Backup file downloaded');
}

// Desktop "pick a file" path (only where supported).
async function pickAndSave(){
  if(HAS_FS){
    try{
      FILE_HANDLE=await window.showSaveFilePicker({
        suggestedName:'hifdh-tracker.json',
        types:[{description:'Hifdh data',accept:{'application/json':['.json']}}]
      });
      return await saveToHandle();
    }catch(e){
      if(e && e.name==='AbortError') return false;
    }
  }
  return false;
}

// Primary Save button: best available method for THIS device.
async function doSave(){
  if(FILE_HANDLE){ if(await saveToHandle()) return true; }
  if(HAS_FS){ if(await pickAndSave()) return true; }
  if(CAN_SHARE_FILES){ if(await shareSave()) return true; }
  downloadBackup();           // universal fallback
  return true;
}

// Copy all data to clipboard as text — bulletproof backstop on any phone.
async function copyBackup(){
  const txt=serialize();
  try{
    await navigator.clipboard.writeText(txt);
    markSaved('clipboard'); showPill('Backup copied — paste it into a note');
    return true;
  }catch(e){
    // Fallback: show a selectable textarea
    showPasteBox('copy',txt);
    return false;
  }
}

// Open/restore.
async function openFile(){
  if(HAS_FS){
    try{
      const [h]=await window.showOpenFilePicker({
        types:[{description:'Hifdh data',accept:{'application/json':['.json']}}]
      });
      FILE_HANDLE=h;
      const file=await h.getFile();
      applyLoaded(await file.text());
      return;
    }catch(e){ if(e && e.name==='AbortError') return; }
  }
  document.getElementById('importFile').click();
}

// Paste-to-restore box (for the clipboard backup path).
function showPasteBox(mode,prefill){
  let ov=document.getElementById('pasteOverlay');
  if(ov)ov.remove();
  ov=document.createElement('div');
  ov.id='pasteOverlay';
  ov.className='paste-ov';
  const isCopy=mode==='copy';
  ov.innerHTML=
    '<div class="paste-box">'
    +'<h3>'+(isCopy?'Your backup text':'Paste your backup')+'</h3>'
    +'<p>'+(isCopy
        ?'Copy everything below and paste it somewhere safe (a note, email to yourself, etc.).'
        :'Paste a previously-copied backup here, then tap Restore.')+'</p>'
    +'<textarea id="pasteTa" '+(isCopy?'readonly':'placeholder="Paste backup text here"')+'>'
      +(prefill?prefill.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])):'')+'</textarea>'
    +'<div class="paste-act">'
      +(isCopy?'<button id="pCopyBtn" class="pgo">Select all</button>'
              :'<button id="pRestoreBtn" class="pgo">Restore</button>')
      +'<button id="pCloseBtn" class="pcl">Close</button>'
    +'</div></div>';
  document.body.appendChild(ov);
  const ta=document.getElementById('pasteTa');
  document.getElementById('pCloseBtn').onclick=()=>ov.remove();
  if(isCopy){
    document.getElementById('pCopyBtn').onclick=()=>{ ta.focus(); ta.select(); };
    ta.focus(); ta.select();
  }else{
    document.getElementById('pRestoreBtn').onclick=()=>{
      const v=ta.value.trim();
      if(!v){ showPill('Nothing pasted'); return; }
      applyLoaded(v); ov.remove();
    };
  }
}

function applyLoaded(txt){
  try{
    const d=JSON.parse(txt);
    if(d && d.ratings){
      STATE=migrate(d);
      markSaved(FILE_HANDLE?'file':'loaded');
      switchTo('overview');
      showPill('Loaded successfully');
    }else{
      showPill('That doesn\u2019t look like a valid backup');
    }
  }catch(e){ showPill('Could not read that backup'); }
}

// Compatibility shim: existing code calls queueSave() everywhere.
function queueSave(){ markChanged(); }

let pillTimer=null;
function showPill(txt){
  const p=document.getElementById('savePill');
  if(!p)return;
  p.textContent=txt; p.classList.add('show');
  clearTimeout(pillTimer);
  pillTimer=setTimeout(()=>p.classList.remove('show'),2200);
}

function fmtTime(d){
  if(!d) return '';
  const hh=String(d.getHours()).padStart(2,'0');
  const mm=String(d.getMinutes()).padStart(2,'0');
  return hh+':'+mm;
}

const SAVE_NUDGE=8; // remind to save after this many changes

function updateSaveUI(){
  const b=document.getElementById('saveBanner');
  if(!b)return;
  if(!DIRTY){
    if(LAST_SAVED_AT){
      if(LAST_SAVED_WHERE==='auto'){
        // Silent automatic saving is working (hosted site). Keep it quiet.
        b.style.display='none';
        return;
      }
      const where = LAST_SAVED_WHERE==='file' ? ' to your file'
                  : LAST_SAVED_WHERE==='shared' ? ' (sent to your chosen app)'
                  : LAST_SAVED_WHERE==='clipboard' ? ' (copied to clipboard)'
                  : LAST_SAVED_WHERE==='download' ? ' (downloaded)'
                  : '';
      b.style.display='block';
      b.className='save-banner ok';
      b.innerHTML='<span class="sdot"></span>Saved'+where+' \u00b7 '+fmtTime(LAST_SAVED_AT);
    }else if(LS_OK){
      // Hosted with working storage but nothing saved yet — reassure once.
      b.style.display='block';
      b.className='save-banner ok';
      b.innerHTML='<span class="sdot"></span>Your progress saves automatically on this device.';
    }else{
      b.style.display='block';
      b.className='save-banner info';
      b.innerHTML='Automatic saving isn\u2019t available here. '
        +'Tap <b>Save</b> to keep a file (send it to iCloud Drive / Files), or <b>Copy backup</b> for a paste-able copy. '
        +'<span class="sub">Hosting this page on the web makes saving automatic \u2014 see the included setup guide.</span>';
    }
    return;
  }
  // DIRTY (only reached when there is no automatic store)
  b.style.display='block';
  b.className='save-banner warn';
  const urgent = CHANGES>=SAVE_NUDGE;
  b.innerHTML='<b>'+CHANGES+' unsaved change'+(CHANGES===1?'':'s')+'.</b> '
    +(urgent?'It\u2019s been a while \u2014 save now so you don\u2019t lose this. ':'Tap Save when you\u2019re ready. ')
    +'<button id="bSave" class="rb">Save</button>'
    +'<button id="bCopy" class="rb alt">Copy backup</button>';
  const bs=document.getElementById('bSave'); if(bs)bs.onclick=()=>doSave();
  const bc=document.getElementById('bCopy'); if(bc)bc.onclick=()=>copyBackup();
}

function getR(id){ return STATE.ratings[id]||{a:0,e:0}; }
function setR(id,k,v){
  const cur=getR(id);
  const nv={...cur,[k]:v};
  if(nv.a===0&&nv.e===0) delete STATE.ratings[id];
  else STATE.ratings[id]=nv;
  queueSave();
}

/* ---------- DERIVED STATS ---------- */
function juzRukus(j){ return QURAN.rukus.filter(r=>r.juz===j); }
function stats(list){
  let mem=0,strong=0,engAny=0,engExplain=0;
  list.forEach(r=>{const x=getR(r.id);
    if(x.a>0)mem++; if(x.a>=4)strong++;
    if(x.e>0)engAny++; if(x.e===5)engExplain++;});
  return {total:list.length,mem,strong,engAny,engExplain};
}
function aDist(list){
  const d=[0,0,0,0,0,0];
  list.forEach(r=>d[getR(r.id).a]++);
  return d;
}

/* ---------- OVERVIEW ---------- */
function renderOverview(){
  const all=QURAN.rukus, s=stats(all), d=aDist(all);
  const memPct=Math.round(s.mem/s.total*100);
  const strPct=Math.round(s.strong/s.total*100);
  const engPct=Math.round(s.engAny/s.total*100);
  // juz fully memorised count
  let juzMem=0,juzStrong=0;
  for(let j=1;j<=30;j++){const js=stats(juzRukus(j));
    if(js.mem===js.total)juzMem++;
    if(js.strong===js.total)juzStrong++;}
  const seg=(d,cols)=>d.map((v,i)=>v?`<i style="width:${v/s.total*100}%;background:${cols[i]}"></i>`:'').join('');

  let jz='';
  for(let j=1;j<=30;j++){
    const js=stats(juzRukus(j)), jd=aDist(juzRukus(j));
    const mp=Math.round(js.mem/js.total*100);
    const fill=jd.map((v,i)=>v?`<i style="width:${v/js.total*100}%;background:${COL_A[i]}"></i>`:'').join('');
    jz+=`<div class="jz" data-jz="${j}">
      <div class="n">Juz ${j}</div>
      <div class="pct">${js.mem}/${js.total} memorised · ${mp}%</div>
      <div class="mini">${fill}</div></div>`;
  }

  document.getElementById('overview').innerHTML=`
   <div class="stat-grid">
     <div class="stat card">
       <div class="lbl">Arabic memorised</div>
       <div class="big">${s.mem}<small> / ${s.total} ruku</small></div>
       <div class="meta">${memPct}% of the Qur'an · ${juzMem} juz complete</div>
     </div>
     <div class="stat card">
       <div class="lbl">Strong</div>
       <div class="big">${s.strong}<small> / ${s.total}</small></div>
       <div class="meta">${strPct}% strong · ${juzStrong} juz fully strong</div>
     </div>
     <div class="stat card">
       <div class="lbl">English understanding</div>
       <div class="big">${s.engAny}<small> / ${s.total}</small></div>
       <div class="meta">${engPct}% started · ${s.engExplain} can explain to others</div>
     </div>
   </div>

   <div class="card" style="padding:20px 22px">
     <div class="lbl" style="font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:var(--ink-soft)">Whole Qur'an — Arabic strength</div>
     <div class="bar">${seg(d,COL_A)}</div>
     <div class="legend">
       ${A_LABELS.map((lab,i)=>`<span><i class="dot" style="background:${COL_A[i]}"></i>${lab} ${d[i]}</span>`).join('')}
     </div>
   </div>

   <h2 class="ov-title">By Juz</h2>
   <div class="ov-note">Tap any juz to jump to its first surah in the tracker.</div>
   <div class="juz-strip">${jz}</div>`;

  document.querySelectorAll('.jz').forEach(el=>el.onclick=()=>{
    const j=+el.dataset.jz;
    const first=QURAN.rukus.find(r=>r.juz===j);
    if(first)CUR_SURAH=first.surah;
    switchTo('tracker');
  });
}

/* ---------- TRACKER ---------- */
let CUR_SURAH=1;
function surahRukus(sn){ return QURAN.rukus.filter(r=>r.surah===sn); }
function renderTracker(){
  // build surah dropdown options with progress glyphs
  let opts='';
  QURAN.surahs.forEach(su=>{
    const ss=stats(surahRukus(su.no));
    const g=ss.mem===ss.total?'✓ ':(ss.mem>0?'· ':'   ');
    opts+=`<option value="${su.no}" ${su.no===CUR_SURAH?'selected':''}>${g}${su.no}. ${su.en} — ${su.mn} (${su.rc} ruku)</option>`;
  });

  const list=surahRukus(CUR_SURAH);
  const f=list[0];
  const ss=stats(list);
  // juz span for this surah (label only)
  const juzSet=[...new Set(list.map(r=>r.juz))].sort((a,b)=>a-b);
  const juzLbl=juzSet.length===1?`Juz ${juzSet[0]}`:`Juz ${juzSet[0]}–${juzSet[juzSet.length-1]}`;

  // prev / next surah buttons
  const prevN=CUR_SURAH>1?CUR_SURAH-1:null;
  const nextN=CUR_SURAH<114?CUR_SURAH+1:null;

  let body=`<div class="surah-blk">`;
  list.forEach(r=>{
    const x=getR(r.id);
    const pa=[1,2,3,4,5].map(v=>`<button class="pip a-${v} ${x.a===v?'on':''}" data-id="${r.id}" data-k="a" data-v="${v}" title="${A_LABELS[v]}">${v}</button>`).join('');
    const pe=[1,2,3,4,5].map(v=>`<button class="pip e-${v} ${x.e===v?'on':''}" data-id="${r.id}" data-k="e" data-v="${v}" title="${E_LABELS[v]}">${v}</button>`).join('');
    body+=`<div class="ruku-row">
      <div class="rk">Ruku ${r.ruku}<small>of ${r.rukuOfSurah} · Juz ${r.juz}</small></div>
      <div class="scales">
        <div class="scale"><span class="cap">Arabic</span><div class="pips">${pa}</div></div>
        <div class="scale"><span class="cap">English</span><div class="pips">${pe}</div></div>
      </div></div>`;
  });
  body+=`</div>`;

  document.getElementById('tracker').innerHTML=`
    <div class="surah-nav">
      <button class="navbtn" id="prevS" ${prevN?'':'disabled'} title="Previous surah">‹</button>
      <select id="surahSel" class="surah-select">${opts}</select>
      <button class="navbtn" id="nextS" ${nextN?'':'disabled'} title="Next surah">›</button>
    </div>
    <div class="surah-h" style="margin-top:18px">
      <span class="sn">${f.surah}. ${f.surahName}</span>
      <span class="sm">${f.surahMeaning}</span>
      <span class="sx">${f.rukuOfSurah} ruku · ${juzLbl} · ${ss.mem}/${ss.total} memorised · ${ss.strong} strong</span>
    </div>
    <div class="help" style="margin:14px 0 16px">
      <b>Arabic 1–5:</b> 1 Very weak · 2 Weak · 3 Middle · 4 Strong · 5 Very strong<br>
      <b>English 1–5:</b> 1 Very basic · 2 Basic · 3 Good · 4 Strong · 5 Can explain to others<br>
      Tap a level to set it; tap it again to clear back to "not memorised".
    </div>
    ${body}`;

  const sel=document.getElementById('surahSel');
  sel.onchange=()=>{CUR_SURAH=+sel.value;renderTracker();};
  const ps=document.getElementById('prevS'), ns=document.getElementById('nextS');
  if(prevN)ps.onclick=()=>{CUR_SURAH=prevN;renderTracker();};
  if(nextN)ns.onclick=()=>{CUR_SURAH=nextN;renderTracker();};
  document.querySelectorAll('.pip').forEach(p=>p.onclick=()=>{
    const id=p.dataset.id,k=p.dataset.k,v=+p.dataset.v;
    const cur=getR(id)[k];
    setR(id,k,cur===v?0:v);
    renderTracker();
  });
}

/* ---------- PLANNER (CALENDAR) ---------- */
const QMETA={
  mem:{name:'New memorisation',short:'New',color:'var(--strong)'},
  revL:{name:'Revision — with looking',short:'Rev (look)',color:'var(--mid)'},
  revN:{name:'Revision — without looking',short:'Rev (no look)',color:'var(--teal)'},
  eng:{name:'English revision',short:'English',color:'var(--green)'}
};
const QORDER=['mem','revL','revN','eng'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];

let PLAN_VIEW='week';            // 'week' | 'month'
let PLAN_REF=new Date();         // anchor date for the displayed period
let SEL_DAY=null;                // 'YYYY-MM-DD' currently open in the panel

function dkey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseKey(k){const[y,m,da]=k.split('-').map(Number);return new Date(y,m-1,da);}
function todayKey(){return dkey(new Date());}
function dayEntries(k){return (STATE.cal&&STATE.cal[k])?STATE.cal[k]:[];}
function startOfWeek(d){const x=new Date(d);x.setDate(x.getDate()-x.getDay());x.setHours(0,0,0,0);return x;}

function planHeaderLabel(){
  if(PLAN_VIEW==='week'){
    const s=startOfWeek(PLAN_REF), e=new Date(s);e.setDate(s.getDate()+6);
    const sm=MON[s.getMonth()].slice(0,3), em=MON[e.getMonth()].slice(0,3);
    return `${sm} ${s.getDate()} – ${em} ${e.getDate()}, ${e.getFullYear()}`;
  }
  return `${MON[PLAN_REF.getMonth()]} ${PLAN_REF.getFullYear()}`;
}
function shiftPlan(dir){
  const d=new Date(PLAN_REF);
  if(PLAN_VIEW==='week') d.setDate(d.getDate()+dir*7);
  else d.setMonth(d.getMonth()+dir);
  PLAN_REF=d; renderPlanner();
}

function dayCellHTML(d,compact){
  const k=dkey(d), entries=dayEntries(k);
  const isToday=k===todayKey();
  const otherMonth=!compact && d.getMonth()!==PLAN_REF.getMonth();
  let dots=entries.slice(0,4).map(en=>`<i class="cdot" style="background:${QMETA[en.action].color};${en.done?'opacity:.35':''}"></i>`).join('');
  if(entries.length>4) dots+=`<i class="cmore">+${entries.length-4}</i>`;
  let lines='';
  if(compact){
    lines=entries.length?entries.map((en,i)=>`
      <div class="cline ${en.done?'cdone':''}">
        <i class="cdot" style="background:${QMETA[en.action].color}"></i>
        <span>${en.note?escapeHtml(en.note):QMETA[en.action].short}</span>
      </div>`).join(''):`<div class="cnone">—</div>`;
  }
  return `<div class="cell ${otherMonth?'dim':''} ${isToday?'today':''} ${SEL_DAY===k?'sel':''}" data-day="${k}">
    <div class="cnum">${d.getDate()}${isToday?'<em>today</em>':''}</div>
    ${compact?`<div class="clines">${lines}</div>`:`<div class="cdots">${dots}</div>`}
  </div>`;
}
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function renderPlanner(){
  let grid='';
  if(PLAN_VIEW==='week'){
    const s=startOfWeek(PLAN_REF);
    let cells='';
    for(let i=0;i<7;i++){const d=new Date(s);d.setDate(s.getDate()+i);cells+=dayCellHTML(d,true);}
    grid=`<div class="cal-grid week">
      ${DOW.map(x=>`<div class="cal-dow">${x}</div>`).join('')}
      ${cells}</div>`;
  }else{
    const first=new Date(PLAN_REF.getFullYear(),PLAN_REF.getMonth(),1);
    const start=startOfWeek(first);
    let cells='';
    for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);cells+=dayCellHTML(d,false);}
    grid=`<div class="cal-grid month">
      ${DOW.map(x=>`<div class="cal-dow">${x}</div>`).join('')}
      ${cells}</div>`;
  }

  // detail panel for selected day
  let panel='';
  if(SEL_DAY){
    const k=SEL_DAY, d=parseKey(k), entries=dayEntries(k);
    const dlabel=`${DOW[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`;
    let elist=entries.length?entries.map((en,i)=>`
      <div class="pentry ${en.done?'pdone':''}">
        <i class="qtag" style="background:${QMETA[en.action].color}"></i>
        <div class="pt"><b>${QMETA[en.action].name}</b>${en.note?`<br><span>${escapeHtml(en.note)}</span>`:''}</div>
        <button class="pdoneb" data-done="${i}" title="${en.done?'Mark not done':'Mark done'}">${en.done?'↺':'✓'}</button>
        <button class="pdel" data-del="${i}" title="Remove">✕</button>
      </div>`).join(''):`<div class="pempty">Nothing planned for this day yet.</div>`;
    panel=`<div class="day-panel card">
      <div class="ph"><h3>${dlabel}</h3><button class="pclose" id="pclose">✕</button></div>
      <div class="plist">${elist}</div>
      <div class="padd">
        <div class="pact">
          ${QORDER.map(q=>`<button class="actbtn" data-act="${q}"><i class="qtag" style="background:${QMETA[q].color}"></i>${QMETA[q].short}</button>`).join('')}
        </div>
        <div class="pnoterow">
          <input id="pnote" type="text" placeholder="What to do? e.g. Juz 6, Al-Baqarah ruku 6–10" autocomplete="off">
          <button id="paddbtn" disabled>Add</button>
        </div>
        <div class="phint">Pick an action above, type a note, then Add. You can add several per day.</div>
      </div>
    </div>`;
  }

  document.getElementById('planner').innerHTML=`
    <div class="cal-bar">
      <div class="cal-title">
        <h2>${planHeaderLabel()}</h2>
        <button class="todaybtn" id="goToday">Today</button>
      </div>
      <div class="cal-ctrl">
        <div class="viewtog">
          <button class="vt ${PLAN_VIEW==='week'?'on':''}" data-v="week">Week</button>
          <button class="vt ${PLAN_VIEW==='month'?'on':''}" data-v="month">Month</button>
        </div>
        <button class="navb" id="prevP" title="Previous">‹</button>
        <button class="navb" id="nextP" title="Next">›</button>
      </div>
    </div>
    <div class="help" style="margin-bottom:16px">
      Click any day to plan it. Choose an action — <b>New memorisation</b>, <b>Revision with / without looking</b>,
      or <b>English revision</b> — add a note, and it appears on the calendar. Tick ✓ when done.
    </div>
    <div class="cal-legend">
      ${QORDER.map(q=>`<span><i class="cdot" style="background:${QMETA[q].color}"></i>${QMETA[q].name}</span>`).join('')}
    </div>
    ${grid}
    ${panel}`;

  // wiring
  document.getElementById('goToday').onclick=()=>{PLAN_REF=new Date();renderPlanner();};
  document.getElementById('prevP').onclick=()=>shiftPlan(-1);
  document.getElementById('nextP').onclick=()=>shiftPlan(1);
  document.querySelectorAll('.vt').forEach(b=>b.onclick=()=>{PLAN_VIEW=b.dataset.v;renderPlanner();});
  document.querySelectorAll('.cell').forEach(c=>c.onclick=()=>{
    SEL_DAY=c.dataset.day; renderPlanner();
    const p=document.querySelector('.day-panel'); if(p)p.scrollIntoView({behavior:'smooth',block:'nearest'});
  });

  if(SEL_DAY){
    const pc=document.getElementById('pclose');
    if(pc)pc.onclick=()=>{SEL_DAY=null;renderPlanner();};
    let chosen=null;
    const noteEl=document.getElementById('pnote');
    const addBtn=document.getElementById('paddbtn');
    const refresh=()=>{addBtn.disabled=!chosen;};
    document.querySelectorAll('.actbtn').forEach(b=>b.onclick=()=>{
      chosen=b.dataset.act;
      document.querySelectorAll('.actbtn').forEach(x=>x.classList.toggle('sel',x===b));
      refresh(); noteEl.focus();
    });
    const doAdd=()=>{
      if(!chosen)return;
      STATE.cal=STATE.cal||{};
      STATE.cal[SEL_DAY]=STATE.cal[SEL_DAY]||[];
      STATE.cal[SEL_DAY].push({action:chosen,note:noteEl.value.trim(),done:false});
      queueSave(); renderPlanner(); showPill('Added to '+SEL_DAY);
    };
    if(addBtn)addBtn.onclick=doAdd;
    if(noteEl)noteEl.onkeydown=e=>{if(e.key==='Enter'&&chosen)doAdd();};
    document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.done; const arr=STATE.cal[SEL_DAY];
      arr[i].done=!arr[i].done; queueSave(); renderPlanner();
    });
    document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.del; STATE.cal[SEL_DAY].splice(i,1);
      if(STATE.cal[SEL_DAY].length===0)delete STATE.cal[SEL_DAY];
      queueSave(); renderPlanner(); showPill('Removed');
    });
  }
}

/* ---------- NAV ---------- */
function switchTo(s){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.s===s));
  document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
  document.getElementById(s).classList.add('active');
  if(s==='overview')renderOverview();
  if(s==='tracker')renderTracker();
  if(s==='planner')renderPlanner();
  window.scrollTo({top:0,behavior:'smooth'});
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>switchTo(t.dataset.s));

/* ---------- BACKUP ---------- */
document.getElementById('exportBtn').onclick=()=>doSave();
document.getElementById('importBtn').onclick=()=>openFile();
document.getElementById('copyBtn').onclick=()=>copyBackup();
document.getElementById('pasteBtn').onclick=()=>showPasteBox('paste');
// Warn before leaving if there are unsaved changes (data lives in a file, not the app).
window.addEventListener('beforeunload',e=>{
  if(DIRTY){ e.preventDefault(); e.returnValue=''; return ''; }
});
// Keyboard shortcut: Ctrl/Cmd+S saves (desktop convenience).
window.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); doSave(); }
});
document.getElementById('importFile').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>applyLoaded(rd.result);
  rd.readAsText(f);
};

/* ---------- INIT ---------- */
(async function(){
  await loadState();
  renderOverview();
  updateSaveUI();
})();
</script>
